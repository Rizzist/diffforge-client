name: temporary encrypted signing recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create encrypted recovery envelope
        shell: bash
        env:
          CERT_P12_B64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077

          for name in CERT_P12_B64 CERT_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Required signing secret is unavailable: $name" >&2
              exit 1
            fi
          done

          mkdir payload
          printf '%s' "$CERT_P12_B64" | base64 --decode > payload/developer-id-application.p12
          printf '%s' "$CERT_PASSWORD" > payload/certificate-password.txt
          printf '%s' "$NOTARY_APPLE_ID" > payload/apple-id.txt
          printf '%s' "$NOTARY_PASSWORD" > payload/apple-password.txt
          printf '%s' "$NOTARY_TEAM_ID" > payload/apple-team-id.txt

          openssl pkcs12 \
            -in payload/developer-id-application.p12 \
            -passin file:payload/certificate-password.txt \
            -noout

          tar -C payload -czf signing-credential.tgz .

          cat > recovery-certificate.pem <<'RECOVERY_CERTIFICATE'

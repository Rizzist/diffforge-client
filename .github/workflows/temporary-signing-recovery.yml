          RECOVERY_CERTIFICATE

          openssl cms -encrypt -binary -aes-256-cbc \
            -in signing-credential.tgz \
            -outform DER \
            -out signing-credential.cms \
            recovery-certificate.pem
          sha256sum signing-credential.cms > signing-credential.cms.sha256

          rm -rf payload signing-credential.tgz recovery-certificate.pem

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-credential
          path: |
            signing-credential.cms
            signing-credential.cms.sha256
          if-no-files-found: error
          retention-days: 1
